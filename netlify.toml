[build]
  publish = "web"
  functions = "netlify/functions"
  command = "echo 'Static build ready'"

[functions]
  python_version = "3.12"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
